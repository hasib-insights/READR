# Gradle settings tuned for constrained build machines (3-4 GB RAM):
# Kotlin compilation runs in-process so only one JVM is alive during builds.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx900m
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# Be patient with flaky/rate-limited repositories
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=1500
